name: Build

on:
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        shell: bash
        run: |
          CA_FILE=$(bun scripts/write-ca-bundle.ts)
          bun install --frozen-lockfile --cafile "$CA_FILE"

      - name: Check
        run: bun run check

      - name: Verify certificate trust
        run: bun scripts/check-tls.ts

      - name: Build
        run: bun build --compile --compile-executable-path="$(bun -p "process.execPath")" --minify --bytecode --target=bun-linux-x64 src/index.ts --outfile dist/genmedia
