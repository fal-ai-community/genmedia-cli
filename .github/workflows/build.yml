name: Build

on:
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --cafile src/lib/public-ca-bundle.pem

      - name: Check
        run: bun run check

      - name: Verify certificate trust
        run: bun scripts/check-tls.ts

      - name: Build
        run: bun build --compile --compile-executable-path="$(command -v bun)" --minify --bytecode --target=bun-linux-x64 src/index.ts --outfile dist/genmedia
